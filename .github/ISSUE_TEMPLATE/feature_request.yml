name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User problem
      description: What problem should ClickLume solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: wayland
    attributes:
      label: Does this require compositor-global input or coordinates?
      options: [No, Yes, Unsure]
    validations:
      required: true
