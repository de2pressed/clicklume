[workspace]
resolver = "2"
members = [
    "clicklume-common",
    "clicklume-backend",
    "clicklume-gui",
    "clicklume-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["de2pressed and ClickLume contributors"]
repository = "https://github.com/de2pressed/clicklume"
homepage = "https://github.com/de2pressed/clicklume"

[workspace.dependencies]
# Input device handling
evdev = "0.13"
nix = "0.27"

# Low-level input
libc = "0.2"

# Configuration
toml = "1.1"
serde = { version = "1", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Serialization
serde_json = "1"

# GUI
eframe = "0.35"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
